[project]
name = "bedtime-story-agent"
version = "1.0.0"
description = "A LangGraph bedtime-story agent with a plan/generate/judge/refine loop, served over FastAPI with a Gradio UI."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",  # line length is enforced by the formatter
    "B008",  # FastAPI's Depends() in defaults is idiomatic
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
